name: APK bauen

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Projekt auspacken
        run: |
          cat teile/teil1.txt teile/teil2.txt teile/teil3.txt | base64 -d > p.tgz
          echo "fcd0b3ee4e39c16f52adf64502664d20e85ada79e79cb296f46f61e03c3e31ac  p.tgz" | sha256sum -c - || { echo "Ein Teil ist unvollständig eingefügt. Bitte Claude Bescheid sagen."; exit 1; }
          mkdir app-src && tar xzf p.tgz -C app-src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: APK bauen
        working-directory: app-src
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: APK bereitstellen
        run: cp app-src/app/build/outputs/apk/release/app-release.apk Innere-Ausrichtung.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Innere Ausrichtung 1.0.${{ github.run_number }}
          make_latest: true
          files: Innere-Ausrichtung.apk
          body: Auf dem Handy „Innere-Ausrichtung.apk“ antippen, herunterladen, installieren.
          
